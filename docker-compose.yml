# Offline multi-agent system.
#
# Every network below is "internal", which means no internet.
# Each agent sits on its own network that it shares ONLY with the coordinator.
# So an agent can reach the coordinator, and nothing else.

x-agent: &agent
  build: ./agents
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:size=16m"]
  mem_limit: 256m
  pids_limit: 64
  restart: unless-stopped

services:
  ollama:
    image: ollama/ollama:latest
    volumes: [ollama_models:/root/.ollama]
    networks: [model_net]
    restart: unless-stopped

  coordinator:
    build: ./coordinator
    environment:
      MODEL: ${MODEL:-llama3.2:3b}
      OLLAMA_URL: http://ollama:11434
      TOKEN_AGENT_A: ${AGENT_A_TOKEN:?run scripts/setup.sh first}
      TOKEN_AGENT_B: ${AGENT_B_TOKEN:?run scripts/setup.sh first}
      TOKEN_AGENT_C: ${AGENT_C_TOKEN:?run scripts/setup.sh first}
    volumes:
      - coordinator_logs:/logs
      - ./coordinator/policy.json:/app/policy.json:ro
    networks: [model_net, net_a, net_b, net_c]
    depends_on: [ollama]
    restart: unless-stopped

  agent_a:
    <<: *agent
    environment:
      AGENT_NAME: agent_a
      AGENT_TOKEN: ${AGENT_A_TOKEN}
      ROLE: "You are the researcher. You find and explain facts clearly."
    volumes: [notes_a:/notes]
    networks: [net_a]

  agent_b:
    <<: *agent
    environment:
      AGENT_NAME: agent_b
      AGENT_TOKEN: ${AGENT_B_TOKEN}
      ROLE: "You are the checker. You look for mistakes and weak points."
    volumes: [notes_b:/notes]
    networks: [net_b]

  agent_c:
    <<: *agent
    environment:
      AGENT_NAME: agent_c
      AGENT_TOKEN: ${AGENT_C_TOKEN}
      ROLE: "You are the writer. You turn findings into short plain summaries."
    volumes: [notes_c:/notes]
    networks: [net_c]

  # Used once, during setup, to download the model while you still have internet.
  model-download:
    image: ollama/ollama:latest
    profiles: [setup]
    volumes: [ollama_models:/root/.ollama]
    networks: [internet]
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull ${MODEL:-llama3.2:3b}"]

networks:
  model_net: { internal: true }
  net_a: { internal: true }
  net_b: { internal: true }
  net_c: { internal: true }
  internet: {}

volumes:
  ollama_models:
  coordinator_logs:
  notes_a:
  notes_b:
  notes_c:
